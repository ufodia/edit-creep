<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">What Edit Creep catches</title>
  <desc id="d">Six kinds of unintended change: rewritten text and numbers, recoloured logos and brand colours, missing or added parts, drifted layout, softened detail, and a global colour cast or crop.</desc>
  <defs>
    <style>
      .card{fill:#13261f;stroke:#ffffff;stroke-opacity:.08}
      .h{font:700 19px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#eaf6f1}
      .s{font:14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9cb8ae}
      .k{font:700 12px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px;fill:#7cf2c8}
      .b{font:700 21px Arial,sans-serif;fill:#2b2b2b}
      .tag{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="470" rx="24" fill="#0b1715"/>
  <text x="40" y="52" class="k">WHAT IT CATCHES</text>
  <text x="40" y="88" fill="#eaf6f1" font-family="Segoe UI Variable Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800">Small changes that cost real money</text>

  <!-- Text & numbers -->
  <g transform="translate(40 116)">
    <rect class="card" width="364" height="150" rx="18"/>
    <rect x="22" y="22" width="132" height="56" rx="8" fill="#f3ead8"/><text x="88" y="56" text-anchor="middle" class="b">250 g</text>
    <path d="M166 50h22" stroke="#7cf2c8" stroke-width="2.5"/>
    <rect x="198" y="22" width="132" height="56" rx="8" fill="#f3ead8" stroke="#ff6b6b" stroke-width="3"/><text x="264" y="56" text-anchor="middle" class="b">200 g</text>
    <text x="22" y="108" class="h">Text and numbers</text>
    <text x="22" y="132" class="s">Weights, prices, dates, labels, signs</text>
  </g>
  <!-- Logos -->
  <g transform="translate(418 116)">
    <rect class="card" width="364" height="150" rx="18"/>
    <circle cx="70" cy="50" r="26" fill="#c8553d"/><text x="70" y="57" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="700">H</text>
    <path d="M110 50h22" stroke="#7cf2c8" stroke-width="2.5"/>
    <circle cx="176" cy="50" r="26" fill="#d9822b" stroke="#ffb454" stroke-width="3"/><text x="176" y="57" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="700">H</text>
    <rect x="232" y="34" width="34" height="34" rx="6" fill="#c8553d"/><rect x="272" y="34" width="34" height="34" rx="6" fill="#d9822b"/>
    <text x="22" y="108" class="h">Logos and brand colours</text>
    <text x="22" y="132" class="s">Hue shifts a brand guide would reject</text>
  </g>
  <!-- Missing parts -->
  <g transform="translate(796 116)">
    <rect class="card" width="364" height="150" rx="18"/>
    <rect x="34" y="26" width="54" height="56" rx="8" fill="#fbfbf8"/><path d="M88 38a16 16 0 0 1 0 32" fill="none" stroke="#fbfbf8" stroke-width="8"/>
    <path d="M128 54h22" stroke="#7cf2c8" stroke-width="2.5"/>
    <rect x="176" y="26" width="54" height="56" rx="8" fill="#fbfbf8"/><rect x="226" y="30" width="26" height="48" rx="6" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="22" y="108" class="h">Missing or added parts</text>
    <text x="22" y="132" class="s">Handles, fingers, buttons, stitching</text>
  </g>
  <!-- Layout drift -->
  <g transform="translate(40 282)">
    <rect class="card" width="364" height="150" rx="18"/>
    <rect x="22" y="22" width="132" height="62" rx="6" fill="#f6f1e7"/><circle cx="66" cy="53" r="18" fill="#e07a5f"/>
    <path d="M166 53h22" stroke="#7cf2c8" stroke-width="2.5"/>
    <rect x="198" y="22" width="132" height="62" rx="6" fill="#f6f1e7"/><circle cx="66" cy="53" r="18" fill="none" stroke="#e07a5f" stroke-dasharray="4 4" transform="translate(176 0)"/><circle cx="256" cy="47" r="18" fill="#e07a5f"/>
    <text x="22" y="114" class="h">Drifted details</text>
    <text x="22" y="136" class="s">Objects nudged, resized or redrawn</text>
  </g>
  <!-- Softened detail -->
  <g transform="translate(418 282)">
    <rect class="card" width="364" height="150" rx="18"/>
    <g fill="#cfe3dc"><rect x="26" y="30" width="110" height="5"/><rect x="26" y="44" width="90" height="5"/><rect x="26" y="58" width="104" height="5"/><rect x="26" y="72" width="70" height="5"/></g>
    <path d="M150 53h22" stroke="#7cf2c8" stroke-width="2.5"/>
    <g fill="#cfe3dc" opacity=".4"><rect x="190" y="29" width="112" height="8" rx="4"/><rect x="190" y="43" width="92" height="8" rx="4"/><rect x="190" y="57" width="106" height="8" rx="4"/><rect x="190" y="71" width="72" height="8" rx="4"/></g>
    <text x="22" y="114" class="h">Softened detail</text>
    <text x="22" y="136" class="s">Fine print and texture re-rendered</text>
  </g>
  <!-- Colour cast & crop -->
  <g transform="translate(796 282)">
    <rect class="card" width="364" height="150" rx="18"/>
    <rect x="22" y="22" width="132" height="66" rx="6" fill="#ddd0bc"/>
    <path d="M166 55h22" stroke="#7cf2c8" stroke-width="2.5"/>
    <rect x="198" y="22" width="132" height="66" rx="6" fill="#ecc6a0"/><rect x="198" y="22" width="12" height="66" fill="#0b1715" opacity=".6"/>
    <text x="22" y="114" class="h">Colour cast and crop</text>
    <text x="22" y="136" class="s">Reported separately, never hidden</text>
  </g>
</svg>
